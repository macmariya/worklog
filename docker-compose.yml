# 本番（NAS）と開発の共通。値は .env に置く（.env.example 参照）
services:
  app:
    build: .
    image: worklog-app:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3000"
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - worklog-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 日次バックアップ（04 §5）。db と同じイメージの pg_dump を busybox crond で毎日 3:00（JST）に流す。
  # UGOS のタスクスケジューラに頼らず、Compose だけで他の機械でも同じように動かすためにコンテナに同居させた
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    entrypoint: ["/scripts/entrypoint.sh"]
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      PGHOST: db
    volumes:
      - ./docker/backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  worklog-pgdata:
