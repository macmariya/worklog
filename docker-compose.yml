# 本番（NAS）と開発の共通。値は .env に置く（.env.example 参照）
services:
  app:
    build: .
    image: worklog-app:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3000"
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - worklog-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  worklog-pgdata:
